server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://192.168.133.128:5432/ai_note
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID:YOUR_OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:YOUR_OSS_ACCESS_KEY_SECRET}
  bucket-name: pcy-ai-note

jwt:
  secret: ${JWT_SECRET:ai-note-default-secret-key-change-in-production}
  expiration: 604800000

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.ainote: warn
    com.zaxxer.hikari: warn
